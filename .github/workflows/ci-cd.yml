name: CI/CD Pipeline - Build, Test, and Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/hello-world
  ARTIFACT_NAME: hello-world-app

jobs:
  # Stage 0: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=high

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '1'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Stage 1: Build and Test
  build-and-test:
    needs: security-scan
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Create application artifact
      run: |
        mkdir -p dist
        zip -r dist/${{ env.ARTIFACT_NAME }}.zip . \
          -x "node_modules/*" ".git/*" ".github/*" "dist/*" "k8s/*" "ansible/*" "tests/*"

    - name: Upload application artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: dist/${{ env.ARTIFACT_NAME }}.zip
        retention-days: 5

  # Stage 2: Build and Push Docker Image
  build-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      id: build
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.build-version }} .
        docker image ls

    - name: Save Docker image as artifact
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.build-version }} \
          -o hello-world-docker-${{ needs.build-and-test.outputs.build-version }}.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ needs.build-and-test.outputs.build-version }}
        path: hello-world-docker-*.tar
        retention-days: 5

  # Stage 3: Deploy to Kubernetes (Minikube)
  deploy-kubernetes:
    needs: [build-and-test, build-docker]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Start Minikube
      uses: medyagh/setup-minikube@master
      with:
        kubernetes-version: v1.28.0

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-${{ needs.build-and-test.outputs.build-version }}

    - name: Load Docker image into Minikube
      run: |
        eval $(minikube docker-env)
        docker load -i hello-world-docker-${{ needs.build-and-test.outputs.build-version }}.tar
        docker images

    - name: Update Kubernetes deployment image
      run: |
        sed -i 's|hello-world:latest|${{ env.IMAGE_NAME }}:${{ needs.build-and-test.outputs.build-version }}|g' k8s/deployment.yaml

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/deployment.yaml

    - name: Wait for deployment to rollout
      run: |
        kubectl rollout status deployment/hello-world -n default --timeout=5m

    - name: Verify deployment
      run: |
        echo "=== Deployment Status ==="
        kubectl get deployment -o wide
        echo ""
        echo "=== Pod Status ==="
        kubectl get pods -o wide
        echo ""
        echo "=== Service Status ==="
        kubectl get service hello-world
        echo ""
        echo "=== Describe Service ==="
        kubectl describe service hello-world

    - name: Port Forward and Test Service
      run: |
        kubectl port-forward service/hello-world 3000:3000 &
        sleep 5
        curl -v http://localhost:3000/
        curl -v http://localhost:3000/health
