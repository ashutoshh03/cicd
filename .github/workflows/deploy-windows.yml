name: Deploy Node.js Application to Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test
      - master

permissions:
  contents: read

jobs:
  deploy-windows:
    runs-on: self-hosted

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # ========================================
      # Verify Ansible
      # ========================================

      - name: Verify Ansible
        shell: powershell
        run: |
          ansible-playbook --version


      # ========================================
      # Install Ansible collections
      # ========================================

      - name: Install Ansible collections
        shell: powershell
        run: |
          ansible-galaxy collection install ansible.windows
          ansible-galaxy collection install community.windows


      # ========================================
      # Verify deployment files
      # ========================================

      - name: Verify Ansible files
        shell: powershell
        run: |
          if (-not (Test-Path "ansible\inventory.yml")) {
            throw "ansible\inventory.yml not found"
          }

          if (-not (Test-Path "ansible\deploy.yml")) {
            throw "ansible\deploy.yml not found"
          }

          if (-not (Test-Path "app.js")) {
            throw "app.js not found"
          }

          if (-not (Test-Path "package.json")) {
            throw "package.json not found"
          }


      # ========================================
      # Run Ansible deployment
      # ========================================

      - name: Deploy using Ansible
        shell: powershell
        env:
          WINDOWS_VM_HOST: ${{ secrets.WINDOWS_VM_HOST }}
          WINDOWS_USERNAME: ${{ secrets.WINDOWS_USERNAME }}
          WINRM_CERT_FILE: ${{ secrets.WINRM_CERT_FILE }}
          WINRM_KEY_FILE: ${{ secrets.WINRM_KEY_FILE }}
        run: |
          ansible-playbook `
            -i ansible\inventory.yml `
            ansible\deploy.yml


      # ========================================
      # Deployment successful
      # ========================================

      - name: Deployment successful
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "ANSIBLE DEPLOYMENT SUCCESSFUL"
          Write-Host "========================================"