name: Deploy Node.js Application to Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test
      - master

permissions:
  contents: read

jobs:
  deploy-windows:
    runs-on: self-hosted

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # ========================================
      # Verify Node.js
      # ========================================

      - name: Verify Node.js and npm
        shell: powershell
        run: |
          Write-Host "Node version:"
          node --version

          Write-Host "npm version:"
          npm --version


      # ========================================
      # Stop existing application on port 3000
      # ========================================

      - name: Free port 3000
        shell: powershell
        run: |
          Write-Host "Checking port 3000..."

          $connections = Get-NetTCPConnection `
            -LocalPort 3000 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connections) {

              $pids = $connections |
                Select-Object -ExpandProperty OwningProcess -Unique

              foreach ($pid in $pids) {
                  Write-Host "Stopping process $pid using port 3000..."

                  Stop-Process `
                    -Id $pid `
                    -Force `
                    -ErrorAction SilentlyContinue
              }

              Start-Sleep -Seconds 2

          } else {
              Write-Host "Port 3000 is already free."
          }

          Write-Host "Port 3000 status after cleanup:"

          Get-NetTCPConnection `
            -LocalPort 3000 `
            -State Listen `
            -ErrorAction SilentlyContinue


      # ========================================
      # Clean old dependencies
      # ========================================

      - name: Clean node_modules
        shell: powershell
        run: |
          if (Test-Path "node_modules") {
              Write-Host "Removing old node_modules..."

              Remove-Item `
                -Path "node_modules" `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          Write-Host "node_modules cleanup completed."


      # ========================================
      # Install dependencies
      # ========================================

      - name: Install dependencies
        shell: powershell
        run: |
          npm ci


      # ========================================
      # Build application
      # ========================================

      - name: Build application
        shell: powershell
        run: |
          npm run build


      # ========================================
      # Start application in background
      # ========================================

      - name: Start application
        shell: powershell
        run: |

          if (Test-Path "app.log") {
              Remove-Item "app.log" -Force
          }

          Write-Host "Starting Node.js application..."

          $env:PORT = "3000"

          Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c npm start > app.log 2>&1" `
            -WorkingDirectory "$PWD" `
            -WindowStyle Hidden

          Write-Host "Application process started."

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "===== Application Log ====="

          if (Test-Path "app.log") {
              Get-Content "app.log"
          }


      # ========================================
      # Verify port 3000
      # ========================================

      - name: Verify application port
        shell: powershell
        run: |

          Write-Host "Checking whether port 3000 is listening..."

          $listening = $false

          for ($i = 1; $i -le 10; $i++) {

              $connection = Get-NetTCPConnection `
                -LocalPort 3000 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($connection) {
                  Write-Host "Port 3000 is listening."
                  $listening = $true
                  break
              }

              Write-Host "Port 3000 not ready. Attempt $i/10"

              Start-Sleep -Seconds 2
          }

          if (-not $listening) {

              Write-Host ""
              Write-Host "===== Application Log ====="

              if (Test-Path "app.log") {
                  Get-Content "app.log"
              }

              throw "Application did not start on port 3000."
          }


      # ========================================
      # Health Check
      # ========================================

      - name: Wait for application health
        shell: powershell
        run: |

          $healthUrl = "http://localhost:3000/health"
          $maxRetries = 20
          $retryDelay = 3

          Write-Host "Waiting for application to become healthy..."
          Write-Host "Health URL: $healthUrl"

          $healthy = $false

          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "Attempt $attempt/$maxRetries succeeded."
                  Write-Host "HTTP Status: $($response.StatusCode)"
                  Write-Host "Response: $($response.Content)"

                  if ($response.StatusCode -eq 200) {
                      $healthy = $true
                      break
                  }

              }
              catch {

                  Write-Host "Attempt $attempt/$maxRetries failed."
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds $retryDelay
          }

          if (-not $healthy) {

              Write-Host ""
              Write-Host "========================================"
              Write-Host "APPLICATION HEALTH CHECK FAILED"
              Write-Host "========================================"

              Write-Host ""
              Write-Host "===== Port 3000 ====="

              Get-NetTCPConnection `
                -LocalPort 3000 `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "===== Node Processes ====="

              Get-Process node `
                -ErrorAction SilentlyContinue |
                Select-Object Id, ProcessName, Path

              Write-Host ""
              Write-Host "===== Application Log ====="

              if (Test-Path "app.log") {
                  Get-Content "app.log"
              }
              else {
                  Write-Host "app.log was not found."
              }

              throw "Application failed health check: $healthUrl"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "APPLICATION IS HEALTHY"
          Write-Host "========================================"


      # ========================================
      # Deployment Summary
      # ========================================

      - name: Deployment successful
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "========================================"
          Write-Host "Application: http://localhost:3000"
          Write-Host "Health:      http://localhost:3000/health"