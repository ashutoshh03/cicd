name: Deploy Node.js Application to Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - test
      - master

permissions:
  contents: read

jobs:
  deploy-windows:
    runs-on: self-hosted

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout source code
        uses: actions/checkout@v7


      # ========================================
      # Verify Node.js
      # ========================================

      - name: Check Node.js
        shell: powershell
        run: |
          $node = node --version 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Node.js is not installed on this Windows runner."
              exit 1
          }

          Write-Host "Node.js version: $node"


      # ========================================
      # Create application directory
      # ========================================

      - name: Create application directory
        shell: powershell
        run: |
          $appDirectory = "C:\apps\hello-world"

          if (!(Test-Path $appDirectory)) {
              New-Item -ItemType Directory -Path $appDirectory -Force | Out-Null
          }

          Write-Host "Application directory: $appDirectory"


      # ========================================
      # Copy application
      # ========================================

      - name: Copy application files
        shell: powershell
        run: |
          $appDirectory = "C:\apps\hello-world"

          Copy-Item "package.json" `
            "$appDirectory\package.json" `
            -Force

          if (Test-Path "package-lock.json") {
              Copy-Item "package-lock.json" `
                "$appDirectory\package-lock.json" `
                -Force
          }

          Copy-Item "app.js" `
            "$appDirectory\app.js" `
            -Force

          Write-Host "Application files copied."


      # ========================================
      # Verify package.json
      # ========================================

      - name: Verify application files
        shell: powershell
        run: |
          $appDirectory = "C:\apps\hello-world"

          if (!(Test-Path "$appDirectory\package.json")) {
              Write-Error "package.json not found."
              exit 1
          }

          if (!(Test-Path "$appDirectory\app.js")) {
              Write-Error "app.js not found."
              exit 1
          }

          Write-Host "Required application files verified."


      # ========================================
      # Install dependencies
      # ========================================

      - name: Install npm dependencies
        shell: powershell
        run: |
          Set-Location "C:\apps\hello-world"

          npm ci

          if ($LASTEXITCODE -ne 0) {
              Write-Error "npm ci failed."
              exit 1
          }

          Write-Host "npm dependencies installed successfully."


      # ========================================
      # Stop existing application
      # ========================================

      - name: Stop existing Node.js application
        shell: powershell
        run: |
          $processes = Get-Process node -ErrorAction SilentlyContinue

          if ($processes) {
              Write-Host "Stopping existing Node.js processes..."

              $processes | Stop-Process -Force -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 2

              Write-Host "Existing Node.js processes stopped."
          }
          else {
              Write-Host "No existing Node.js process found."
          }


      # ========================================
      # Start application
      # ========================================

      - name: Start Node.js application
        shell: powershell
        run: |
          $appDirectory = "C:\apps\hello-world"

          $logPath = "$appDirectory\app.log"
          $errorLogPath = "$appDirectory\app-error.log"
          $pidPath = "$appDirectory\app.pid"

          if (Test-Path $logPath) {
              Remove-Item $logPath -Force
          }

          if (Test-Path $errorLogPath) {
              Remove-Item $errorLogPath -Force
          }

          $process = Start-Process `
            -FilePath "node" `
            -ArgumentList "app.js" `
            -WorkingDirectory $appDirectory `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $errorLogPath `
            -WindowStyle Hidden `
            -PassThru

          $process.Id | Out-File `
            -FilePath $pidPath `
            -Encoding ascii

          Write-Host "Application started."
          Write-Host "PID: $($process.Id)"


      # ========================================
      # Health check
      # ========================================

      - name: Wait for application health
        shell: powershell
        run: |
          $maxRetries = 10
          $retryDelay = 3
          $healthUrl = "http://localhost:3000/health"

          Write-Host "Waiting for application to become healthy..."

          for ($i = 1; $i -le $maxRetries; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  if ($response.StatusCode -eq 200) {

                      Write-Host "========================================"
                      Write-Host "APPLICATION IS HEALTHY"
                      Write-Host "========================================"

                      Write-Host "Response:"
                      Write-Host $response.Content

                      exit 0
                  }

              }
              catch {

                  Write-Host "Attempt $i/$maxRetries failed."
              }

              if ($i -lt $maxRetries) {
                  Start-Sleep -Seconds $retryDelay
              }
          }

          Write-Host "========================================"
          Write-Host "APPLICATION FAILED HEALTH CHECK"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Application log:"
          if (Test-Path "C:\apps\hello-world\app.log") {
              Get-Content "C:\apps\hello-world\app.log"
          }

          Write-Host ""
          Write-Host "Application error log:"
          if (Test-Path "C:\apps\hello-world\app-error.log") {
              Get-Content "C:\apps\hello-world\app-error.log"
          }

          exit 1


      # ========================================
      # Verify process
      # ========================================

      - name: Verify Node.js process
        shell: powershell
        run: |
          $processes = Get-Process node -ErrorAction SilentlyContinue

          if (!$processes) {
              Write-Error "No Node.js process found."
              exit 1
          }

          Write-Host "Node.js application is running."

          $processes | ForEach-Object {
              Write-Host "PID: $($_.Id)"
          }


      # ========================================
      # Verify port
      # ========================================

      - name: Verify port 3000
        shell: powershell
        run: |
          $connection = Get-NetTCPConnection `
            -LocalPort 3000 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$connection) {
              Write-Error "Nothing is listening on port 3000."
              exit 1
          }

          Write-Host "Port 3000 is listening."


      # ========================================
      # Deployment summary
      # ========================================

      - name: Deployment summary
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS DEPLOYMENT SUCCESSFUL"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Application: hello-world"
          Write-Host "Directory:   C:\apps\hello-world"
          Write-Host "Port:        3000"
          Write-Host ""
          Write-Host "Application:"
          Write-Host "http://localhost:3000/"
          Write-Host ""
          Write-Host "Health:"
          Write-Host "http://localhost:3000/health"
          Write-Host ""
          Write-Host "Log:"
          Write-Host "C:\apps\hello-world\app.log"
          Write-Host ""
          Write-Host "Error log:"
          Write-Host "C:\apps\hello-world\app-error.log"
          Write-Host ""
          Write-Host "========================================"


      # ========================================
      # Failure diagnostics
      # ========================================

      - name: Deployment diagnostics
        if: failure()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " DEPLOYMENT FAILED - DIAGNOSTICS"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Node.js:"
          node --version

          Write-Host ""
          Write-Host "Application directory:"
          Get-ChildItem "C:\apps\hello-world" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Node processes:"
          Get-Process node `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Port 3000:"
          Get-NetTCPConnection `
            -LocalPort 3000 `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Application log:"
          if (Test-Path "C:\apps\hello-world\app.log") {
              Get-Content "C:\apps\hello-world\app.log"
          }

          Write-Host ""
          Write-Host "Application error log:"
          if (Test-Path "C:\apps\hello-world\app-error.log") {
              Get-Content "C:\apps\hello-world\app-error.log"
          }