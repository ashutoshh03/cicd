name: Deploy to Windows VM via Ansible

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  workflow_run:
    workflows:
      - "CI/CD Pipeline - Build, Test, and Deploy to Kubernetes"
    types:
      - completed


# ============================================================
# JOB 1 - VALIDATE & PREPARE
# ============================================================

jobs:

  validate-and-prepare:

    name: 1. Validate & Prepare
    runs-on: self-hosted

    # For workflow_run, deploy only when previous workflow succeeded.
    # For push/manual runs, always allow deployment.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # For workflow_run use the exact commit that triggered
          # the previous workflow.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}


      # --------------------------------------------------------
      # VALIDATE SECRETS
      # --------------------------------------------------------

      - name: Validate required secrets
        env:
          WINDOWS_VM_HOST: ${{ secrets.WINDOWS_VM_HOST }}
          WINDOWS_USERNAME: ${{ secrets.WINDOWS_USERNAME }}
          WINRM_CERT: ${{ secrets.WINRM_CERT }}
          WINRM_KEY: ${{ secrets.WINRM_KEY }}

        shell: bash

        run: |
          set -e

          echo "========================================"
          echo "Validating deployment secrets"
          echo "========================================"

          if [ -z "$WINDOWS_VM_HOST" ]; then
            echo "ERROR: WINDOWS_VM_HOST secret is not set"
            exit 1
          fi

          if [ -z "$WINDOWS_USERNAME" ]; then
            echo "ERROR: WINDOWS_USERNAME secret is not set"
            exit 1
          fi

          if [ -z "$WINRM_CERT" ]; then
            echo "ERROR: WINRM_CERT secret is not set"
            exit 1
          fi

          if [ -z "$WINRM_KEY" ]; then
            echo "ERROR: WINRM_KEY secret is not set"
            exit 1
          fi

          echo "✓ All required secrets are configured"


      # --------------------------------------------------------
      # INSTALL ANSIBLE
      # --------------------------------------------------------

      - name: Install Ansible and WinRM dependencies
        shell: bash

        run: |
          set -e

          echo "========================================"
          echo "Installing Ansible"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ansible \
            python3 \
            python3-pip \
            python3-venv

          echo "Creating Python virtual environment..."

          python3 -m venv ~/ansible-venv

          source ~/ansible-venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            ansible-core \
            pywinrm \
            pywinrm[credssp]

          echo "Installing Ansible Windows collections..."

          ansible-galaxy collection install ansible.windows
          ansible-galaxy collection install community.windows

          echo "✓ Ansible installation completed"

          ansible --version

          python -c "import ansible, winrm; print('✓ Ansible and WinRM imports available')"


      # --------------------------------------------------------
      # SETUP WINRM CERTIFICATES
      # --------------------------------------------------------

      - name: Setup WinRM certificates
        env:
          WINRM_CERT: ${{ secrets.WINRM_CERT }}
          WINRM_KEY: ${{ secrets.WINRM_KEY }}

        shell: bash

        run: |
          set -e

          echo "========================================"
          echo "Setting up WinRM certificates"
          echo "========================================"

          mkdir -p "$HOME/.winrm"
          chmod 700 "$HOME/.winrm"

          printf '%s\n' "$WINRM_CERT" > "$HOME/.winrm/client.pem"
          printf '%s\n' "$WINRM_KEY" > "$HOME/.winrm/client-key.pem"

          chmod 600 "$HOME/.winrm/client.pem"
          chmod 600 "$HOME/.winrm/client-key.pem"

          echo "✓ WinRM certificates configured"


      # --------------------------------------------------------
      # CREATE INVENTORY
      # --------------------------------------------------------

      - name: Create Ansible inventory
        env:
          WINDOWS_VM_HOST: ${{ secrets.WINDOWS_VM_HOST }}
          WINDOWS_USERNAME: ${{ secrets.WINDOWS_USERNAME }}

        shell: bash

        run: |
          set -e

          echo "========================================"
          echo "Creating Ansible inventory"
          echo "========================================"

          cat > /tmp/windows-inventory.yml <<EOF
          all:
            hosts:
              windows_vm:
                ansible_host: ${WINDOWS_VM_HOST}
                ansible_user: ${WINDOWS_USERNAME}
                ansible_port: 5986
                ansible_connection: winrm
                ansible_winrm_transport: certificate
                ansible_winrm_server_cert_validation: ignore
                ansible_winrm_cert_pem: ${HOME}/.winrm/client.pem
                ansible_winrm_cert_key_pem: ${HOME}/.winrm/client-key.pem
          EOF

          echo "✓ Ansible inventory created"


      # --------------------------------------------------------
      # VERIFY CONNECTIVITY
      # --------------------------------------------------------

      - name: Verify Ansible connectivity
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

        shell: bash

        run: |
          set -e

          source ~/ansible-venv/bin/activate

          echo "========================================"
          echo "Testing WinRM connectivity"
          echo "========================================"

          ansible \
            -i /tmp/windows-inventory.yml \
            windows_vm \
            -m ansible.windows.win_ping

          echo "✓ Windows VM connectivity successful"


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Cleanup certificates
        if: always()

        shell: bash

        run: |
          rm -rf "$HOME/.winrm"

          echo "✓ Certificates removed"



# ============================================================
# JOB 2 - DEPLOY
# ============================================================

  deploy-windows-vm:

    name: 2. Deploy to Windows VM
    runs-on: self-hosted

    needs: validate-and-prepare

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}


      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------

      - name: Install Ansible and WinRM dependencies
        shell: bash

        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ansible \
            python3 \
            python3-pip \
            python3-venv

          python3 -m venv ~/ansible-venv

          source ~/ansible-venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            ansible-core \
            pywinrm \
            pywinrm[credssp]

          ansible-galaxy collection install ansible.windows
          ansible-galaxy collection install community.windows

          echo "✓ Dependencies installed"


      # --------------------------------------------------------
      # SETUP CERTIFICATES
      # --------------------------------------------------------

      - name: Setup WinRM certificates
        env:
          WINRM_CERT: ${{ secrets.WINRM_CERT }}
          WINRM_KEY: ${{ secrets.WINRM_KEY }}

        shell: bash

        run: |
          set -e

          mkdir -p "$HOME/.winrm"
          chmod 700 "$HOME/.winrm"

          printf '%s\n' "$WINRM_CERT" > "$HOME/.winrm/client.pem"
          printf '%s\n' "$WINRM_KEY" > "$HOME/.winrm/client-key.pem"

          chmod 600 "$HOME/.winrm/client.pem"
          chmod 600 "$HOME/.winrm/client-key.pem"

          echo "✓ WinRM certificates configured"


      # --------------------------------------------------------
      # CREATE INVENTORY
      # --------------------------------------------------------

      - name: Create Ansible inventory
        env:
          WINDOWS_VM_HOST: ${{ secrets.WINDOWS_VM_HOST }}
          WINDOWS_USERNAME: ${{ secrets.WINDOWS_USERNAME }}

        shell: bash

        run: |
          set -e

          cat > /tmp/windows-inventory.yml <<EOF
          all:
            hosts:
              windows_vm:
                ansible_host: ${WINDOWS_VM_HOST}
                ansible_user: ${WINDOWS_USERNAME}
                ansible_port: 5986
                ansible_connection: winrm
                ansible_winrm_transport: certificate
                ansible_winrm_server_cert_validation: ignore
                ansible_winrm_cert_pem: ${HOME}/.winrm/client.pem
                ansible_winrm_cert_key_pem: ${HOME}/.winrm/client-key.pem
          EOF

          echo "✓ Ansible inventory created"


      # --------------------------------------------------------
      # RUN PLAYBOOK
      # --------------------------------------------------------

      - name: Run Ansible deployment playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

        shell: bash

        run: |
          set -e

          source ~/ansible-venv/bin/activate

          echo "========================================"
          echo "Deploying application to Windows VM"
          echo "========================================"

          ansible-playbook \
            -i /tmp/windows-inventory.yml \
            ansible/playbook.yml \
            -vv

          echo "✓ Ansible deployment completed"


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Cleanup certificates
        if: always()

        shell: bash

        run: |
          rm -rf "$HOME/.winrm"

          echo "✓ Certificates removed"



# ============================================================
# JOB 3 - VERIFY DEPLOYMENT
# ============================================================

  verify-deployment:

    name: 3. Verify Deployment
    runs-on: self-hosted

    needs: deploy-windows-vm

    steps:

      # --------------------------------------------------------
      # INSTALL ANSIBLE
      # --------------------------------------------------------

      - name: Install Ansible and WinRM dependencies
        shell: bash

        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ansible \
            python3 \
            python3-pip \
            python3-venv

          python3 -m venv ~/ansible-venv

          source ~/ansible-venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            ansible-core \
            pywinrm \
            pywinrm[credssp]

          ansible-galaxy collection install ansible.windows
          ansible-galaxy collection install community.windows

          echo "✓ Dependencies installed"


      # --------------------------------------------------------
      # SETUP CERTIFICATES
      # --------------------------------------------------------

      - name: Setup WinRM certificates
        env:
          WINRM_CERT: ${{ secrets.WINRM_CERT }}
          WINRM_KEY: ${{ secrets.WINRM_KEY }}

        shell: bash

        run: |
          set -e

          mkdir -p "$HOME/.winrm"
          chmod 700 "$HOME/.winrm"

          printf '%s\n' "$WINRM_CERT" > "$HOME/.winrm/client.pem"
          printf '%s\n' "$WINRM_KEY" > "$HOME/.winrm/client-key.pem"

          chmod 600 "$HOME/.winrm/client.pem"
          chmod 600 "$HOME/.winrm/client-key.pem"


      # --------------------------------------------------------
      # CREATE INVENTORY
      # --------------------------------------------------------

      - name: Create Ansible inventory
        env:
          WINDOWS_VM_HOST: ${{ secrets.WINDOWS_VM_HOST }}
          WINDOWS_USERNAME: ${{ secrets.WINDOWS_USERNAME }}

        shell: bash

        run: |
          set -e

          cat > /tmp/windows-inventory.yml <<EOF
          all:
            hosts:
              windows_vm:
                ansible_host: ${WINDOWS_VM_HOST}
                ansible_user: ${WINDOWS_USERNAME}
                ansible_port: 5986
                ansible_connection: winrm
                ansible_winrm_transport: certificate
                ansible_winrm_server_cert_validation: ignore
                ansible_winrm_cert_pem: ${HOME}/.winrm/client.pem
                ansible_winrm_cert_key_pem: ${HOME}/.winrm/client-key.pem
          EOF


      # --------------------------------------------------------
      # VERIFY APPLICATION
      # --------------------------------------------------------

      - name: Verify deployment
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

        shell: bash

        run: |
          set -e

          source ~/ansible-venv/bin/activate

          echo "========================================"
          echo "Verifying Windows VM deployment"
          echo "========================================"

          echo ""
          echo "Checking running processes..."

          ansible \
            -i /tmp/windows-inventory.yml \
            windows_vm \
            -m ansible.windows.win_command \
            -a "tasklist.exe"

          echo ""
          echo "Checking Node.js process..."

          NODE_OUTPUT=$(ansible \
            -i /tmp/windows-inventory.yml \
            windows_vm \
            -m ansible.windows.win_shell \
            -a "Get-Process node -ErrorAction SilentlyContinue")

          echo "$NODE_OUTPUT"

          if echo "$NODE_OUTPUT" | grep -qi "node"; then
            echo "✓ Node.js process is running"
          else
            echo "ERROR: Node.js process was not found"
            exit 1
          fi

          echo ""
          echo "✓ Deployment verification successful"


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Cleanup certificates
        if: always()

        shell: bash

        run: |
          rm -rf "$HOME/.winrm"

          echo "✓ Certificates removed"



# ============================================================
# JOB 4 - SUMMARY
# ============================================================

  deployment-summary:

    name: 4. Deployment Summary
    runs-on: self-hosted

    needs: verify-deployment

    if: success()

    steps:

      - name: Deployment successful
        shell: bash

        run: |
          echo "========================================"
          echo "WINDOWS VM DEPLOYMENT SUCCESSFUL"
          echo "========================================"

          echo ""
          echo "Application deployed successfully."

          echo "Deployment method:"
          echo "Ansible + WinRM certificate authentication"

          echo ""

          echo "Verification:"
          echo "✓ Windows VM connectivity"
          echo "✓ Ansible deployment"
          echo "✓ Node.js process"

          echo ""

          echo "Application:"
          echo "Path: C:\apps\hello-world"
          echo "Port: 3000"

          echo ""

          echo "========================================"

