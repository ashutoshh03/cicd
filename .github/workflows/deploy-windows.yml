name: Deploy to Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test
      - master

jobs:
  deploy-windows:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check Node.js
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: |
          npm ci

      - name: Build application
        shell: powershell
        run: |
          npm run build

      - name: Deploy application
        shell: powershell
        run: |
          if (!(Test-Path "C:\apps\hello-world")) {
              New-Item -ItemType Directory -Path "C:\apps\hello-world" -Force
          }

          # Your deployment commands here

      - name: Verify application
        shell: powershell
        run: |
          Get-Process node -ErrorAction SilentlyContinue

      - name: Deployment successful
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " WINDOWS DEPLOYMENT SUCCESSFUL"
          Write-Host "========================================"