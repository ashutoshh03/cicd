name: Deploy Artifact to Linux VM

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (dev/qa/prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - prod

  push:
    branches:
      - main
      - master
      - test

  workflow_run:
    workflows:
      - "CI/CD Pipeline - Build, Test, and Deploy to Kubernetes"
    types:
      - completed

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    outputs:
      artifact-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA}"
          echo "version=${VERSION:0:8}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Create application artifact
        shell: bash
        run: |
          set -e

          mkdir -p dist

          zip -r dist/hello-world-app.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "dist/*" \
            -x "k8s/*" \
            -x "helm/*" \
            -x "ansible/*" \
            -x "tests/*"

          echo "Artifact created:"
          ls -lh dist/hello-world-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-app
          path: dist/hello-world-app.zip
          retention-days: 7

  deploy-linux:
    needs: build-artifact

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      matrix:
        environment: [dev]

    env:
      LINUX_VM_HOST: ${{ secrets.LINUX_VM_HOST }}
      LINUX_VM_USER: ${{ secrets.LINUX_VM_USER }}
      LINUX_VM_KEY: ${{ secrets.LINUX_VM_SSH_KEY }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate deployment prerequisites
        shell: bash
        run: |
          set -e

          echo "Validating deployment prerequisites..."

          if [ -z "$LINUX_VM_HOST" ]; then
            echo "ERROR: LINUX_VM_HOST secret is not set"
            exit 1
          fi

          if [ -z "$LINUX_VM_USER" ]; then
            echo "ERROR: LINUX_VM_USER secret is not set"
            exit 1
          fi

          if [ -z "$LINUX_VM_KEY" ]; then
            echo "ERROR: LINUX_VM_SSH_KEY secret is not set"
            exit 1
          fi

          echo "✓ All required secrets are configured"

      - name: Set up SSH key
        shell: bash
        run: |
          set -e

          echo "Setting up SSH key..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$LINUX_VM_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keyscan -H "$LINUX_VM_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

          echo "✓ SSH key configured"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hello-world-app
          path: dist

      - name: Prepare artifact for deployment
        shell: bash
        run: |
          set -e

          echo "Preparing artifact..."

          if [ ! -f "dist/hello-world-app.zip" ]; then
            echo "ERROR: Artifact not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Artifact size:"
          du -h dist/hello-world-app.zip

          echo "✓ Artifact prepared"

      - name: Install Ansible
        shell: bash
        run: |
          set -e

          echo "Installing Ansible..."

          sudo apt-get update
          sudo apt-get install -y ansible python3-pip

          python3 -m pip install --user ansible

          echo "Ansible version:"
          ansible --version

      - name: Create Ansible inventory
        shell: bash
        run: |
          set -e

          echo "Creating dynamic Ansible inventory..."

          cat > /tmp/linux-inventory.yml <<EOF
          all:
            hosts:
              linux_vm:
                ansible_host: "${LINUX_VM_HOST}"
                ansible_user: "${LINUX_VM_USER}"
                ansible_ssh_private_key_file: "$HOME/.ssh/id_rsa"
                ansible_python_interpreter: /usr/bin/python3
                ansible_port: 22
                app_port: 3000
                app_directory: /opt/hello-world
                app_user: "${LINUX_VM_USER}"

            vars:
              ansible_connection: ssh
              deployment_env: "${{ matrix.environment }}"
              app_name: hello-world
              artifact_source_dir: /tmp/artifacts
              artifact_name: hello-world-app.zip
          EOF

          echo "Inventory created:"
          cat /tmp/linux-inventory.yml

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -e

          echo "Testing SSH connectivity to Linux VM..."

          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$LINUX_VM_USER@$LINUX_VM_HOST" \
            "echo 'SSH connection successful' && uname -a"

          echo "✓ SSH connectivity verified"

      - name: Copy artifact to Linux VM
        shell: bash
        run: |
          set -e

          echo "Creating remote artifact directory..."

          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -o StrictHostKeyChecking=yes \
            "$LINUX_VM_USER@$LINUX_VM_HOST" \
            "mkdir -p /tmp/artifacts"

          echo "Copying artifact to Linux VM..."

          scp \
            -i "$HOME/.ssh/id_rsa" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            dist/hello-world-app.zip \
            "$LINUX_VM_USER@$LINUX_VM_HOST:/tmp/artifacts/hello-world-app.zip"

          echo "✓ Artifact copied successfully"

      - name: Run Ansible deployment playbook
        shell: bash
        run: |
          set -e

          echo "Running Ansible deployment playbook..."

          ansible-playbook \
            -i /tmp/linux-inventory.yml \
            ansible/linux-deployment-playbook.yml \
            -v \
            -e "artifact_source_dir=/tmp/artifacts" \
            -e "artifact_name=hello-world-app.zip" \
            -e "deployment_env=${{ matrix.environment }}"

      - name: Verify deployment
        shell: bash
        run: |
          set -e

          echo "Verifying deployment on Linux VM..."

          ssh \
            -i "$HOME/.ssh/id_rsa" \
            -o StrictHostKeyChecking=yes \
            "$LINUX_VM_USER@$LINUX_VM_HOST" 'bash -s' <<'VERIFY_SCRIPT'

          set -e

          echo "========================================="
          echo "Deployment Verification"
          echo "========================================="

          echo ""
          echo "Checking application directory..."

          if [ -d "/opt/hello-world" ]; then
            echo "✓ Application directory exists"
            ls -la /opt/hello-world/ | head -20
          else
            echo "✗ Application directory not found"
            exit 1
          fi

          echo ""
          echo "Checking Node.js process..."

          if pgrep -f "node.*app.js" > /dev/null; then
            echo "✓ Application process is running"
            pgrep -af "node.*app.js"
          else
            echo "✗ Application process not found"
            exit 1
          fi

          echo ""
          echo "Testing health endpoint..."

          if HEALTH_STATUS=$(curl -fsS --max-time 10 http://localhost:3000/health); then
            echo "✓ Health endpoint is accessible"
            echo "Response: $HEALTH_STATUS"
          else
            echo "✗ Health endpoint is not accessible"
            exit 1
          fi

          echo ""
          echo "Testing main endpoint..."

          if MAIN_STATUS=$(curl -fsS --max-time 10 http://localhost:3000/); then
            echo "✓ Main endpoint is accessible"
            echo "Response: $MAIN_STATUS"
          else
            echo "✗ Main endpoint is not accessible"
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "✓ All verification checks passed"
          echo "========================================="

          VERIFY_SCRIPT

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "LINUX VM DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "Application Deployment Details:"
          echo "  Host: $LINUX_VM_HOST"
          echo "  User: $LINUX_VM_USER"
          echo "  Directory: /opt/hello-world"
          echo "  Port: 3000"
          echo "  Environment: ${{ matrix.environment }}"
          echo "  Version: ${{ needs.build-artifact.outputs.artifact-version }}"
          echo ""
          echo "Access Application:"
          echo "  Main: http://$LINUX_VM_HOST:3000/"
          echo "  Health: http://$LINUX_VM_HOST:3000/health"
          echo ""
          echo "View Logs:"
          echo "  ssh $LINUX_VM_USER@$LINUX_VM_HOST"
          echo "  tail -f /opt/hello-world/application.log"
          echo ""
          echo "Verify Process:"
          echo "  ssh $LINUX_VM_USER@$LINUX_VM_HOST 'ps aux | grep node'"
          echo ""
          echo "========================================"

      - name: Deployment failed
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "LINUX VM DEPLOYMENT FAILED"
          echo "========================================"
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Verify Linux VM is accessible"
          echo "2. Check SSH credentials"
          echo "3. Ensure application directory has proper permissions"
          echo "4. Check application logs on the VM"
          echo "5. Verify Node.js and npm are installed on the VM"
          echo ""
          echo "Manual debugging:"
          echo "  ssh $LINUX_VM_USER@$LINUX_VM_HOST"
          echo "  tail -f /opt/hello-world/application.log"
          echo ""
          echo "========================================"

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          echo "Cleaning up SSH credentials..."

          rm -f "$HOME/.ssh/id_rsa"
          rm -f "$HOME/.ssh/known_hosts"

          echo "✓ SSH credentials removed"