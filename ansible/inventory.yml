all:
  hosts:
    windows_vm:
      ansible_host: "{{ lookup('env', 'WINDOWS_VM_HOST') }}"
      ansible_user: "{{ lookup('env', 'WINDOWS_USERNAME') }}"

      ansible_connection: winrm
      ansible_port: 5986
      ansible_winrm_transport: certificate

      ansible_winrm_server_cert_validation: ignore

      ansible_winrm_cert_pem: "{{ lookup('env', 'WINRM_CERT_FILE') }}"
      ansible_winrm_cert_key_pem: "{{ lookup('env', 'WINRM_KEY_FILE') }}"