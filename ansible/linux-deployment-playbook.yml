---
- name: Deploy Application Artifact to Linux VM
  hosts: linux_vms
  become: yes
  become_user: "{{ app_user | default('root') }}"
  gather_facts: yes
  vars:
    deployment_status: "starting"
    app_pid_file: "{{ app_directory }}/.app.pid"
    app_log_file: "{{ app_directory }}/application.log"
    app_service_name: "{{ app_name }}"
    backup_dir: "{{ app_directory }}/backups"
    current_date: "{{ ansible_date_time.iso8601_basic_short }}"

  pre_tasks:
    - name: Display deployment information
      debug:
        msg: |
          ========================================
          Deployment Information
          ========================================
          Host: {{ inventory_hostname }}
          Application: {{ app_name }}
          Environment: {{ deployment_env }}
          Deployment Time: {{ ansible_date_time.iso8601 }}
          ========================================

    - name: Verify prerequisites
      block:
        - name: Check Node.js installation
          command: node --version
          register: node_version
          changed_when: false

        - name: Check npm installation
          command: npm --version
          register: npm_version
          changed_when: false

        - name: Display Node.js and npm versions
          debug:
            msg: |
              Node.js: {{ node_version.stdout }}
              NPM: {{ npm_version.stdout }}

      rescue:
        - name: Fail if prerequisites not met
          fail:
            msg: "Node.js and npm must be installed on the target system"

  tasks:
    # Artifact Transfer and Verification
    - name: Create temporary artifact directory
      file:
        path: "{{ artifact_source_dir }}"
        state: directory
        mode: '0755'

    - name: Transfer artifact
      block:
        - name: Copy artifact from GitHub Actions workspace
          copy:
            src: "{{ playbook_dir }}/../dist/{{ artifact_name }}.zip"
            dest: "{{ artifact_source_dir }}/{{ artifact_name }}.zip"
            mode: '0644'
          register: artifact_copy
          retries: 3
          delay: 5

        - name: Verify artifact exists
          stat:
            path: "{{ artifact_source_dir }}/{{ artifact_name }}.zip"
          register: artifact_stat

        - name: Display artifact information
          debug:
            msg: |
              Artifact: {{ artifact_stat.stat.path }}
              Size: {{ artifact_stat.stat.size }} bytes
              Modified: {{ artifact_stat.stat.mtime }}

      rescue:
        - name: Artifact transfer failed
          fail:
            msg: "Failed to transfer artifact to target system"

    # Backup current deployment
    - name: Create backup of current deployment
      block:
        - name: Create backup directory
          file:
            path: "{{ backup_dir }}/{{ current_date }}"
            state: directory
            mode: '0755'

        - name: Backup current application (if exists)
          shell: |
            if [ -d "{{ app_directory }}" ] && [ -f "{{ app_directory }}/package.json" ]; then
              cp -r "{{ app_directory }}" "{{ backup_dir }}/{{ current_date }}/app_backup"
              echo "Backup created successfully"
            else
              echo "No existing application to backup"
            fi
          register: backup_result
          changed_when: "'created' in backup_result.stdout or 'Backup' in backup_result.stdout"

        - name: Display backup status
          debug:
            msg: "{{ backup_result.stdout }}"

      rescue:
        - name: Backup failed but continuing
          debug:
            msg: "Warning: Backup failed, but continuing with deployment"

    # Stop existing application
    - name: Stop existing application
      block:
        - name: Check if application is running
          shell: |
            if [ -f "{{ app_pid_file }}" ]; then
              PID=$(cat "{{ app_pid_file }}")
              if ps -p $PID > /dev/null 2>&1; then
                echo "running"
              else
                echo "stopped"
              fi
            else
              echo "stopped"
            fi
          register: app_status
          changed_when: false

        - name: Stop application gracefully
          shell: |
            if [ -f "{{ app_pid_file }}" ]; then
              PID=$(cat "{{ app_pid_file }}")
              if ps -p $PID > /dev/null 2>&1; then
                kill -TERM $PID
                sleep {{ service_restart_delay }}
                if ps -p $PID > /dev/null 2>&1; then
                  kill -9 $PID
                  echo "Force killed process $PID"
                else
                  echo "Gracefully stopped process $PID"
                fi
              fi
            fi
          changed_when: "'killed' in stop_result.stdout"
          register: stop_result
          when: app_status.stdout == "running"

        - name: Remove PID file
          file:
            path: "{{ app_pid_file }}"
            state: absent

      rescue:
        - name: Stop application failed but continuing
          debug:
            msg: "Warning: Could not stop existing application, continuing"

    # Deploy artifact
    - name: Deploy application artifact
      block:
        - name: Create application directory
          file:
            path: "{{ app_directory }}"
            state: directory
            mode: '0755'
            owner: "{{ app_user | default('root') }}"

        - name: Extract artifact
          unarchive:
            src: "{{ artifact_source_dir }}/{{ artifact_name }}.zip"
            dest: "{{ app_directory }}"
            remote_src: yes
            creates: "{{ app_directory }}/package.json"

        - name: Verify package.json exists
          stat:
            path: "{{ app_directory }}/package.json"
          register: package_json

        - name: Fail if package.json missing
          fail:
            msg: "package.json not found in deployed artifact"
          when: not package_json.stat.exists

        - name: Install npm dependencies
          shell: |
            cd "{{ app_directory }}"
            npm ci --production
          register: npm_install
          retries: 3
          delay: 5
          timeout: 300

        - name: Display npm install output
          debug:
            msg: |
              NPM installation completed
              Output: {{ npm_install.stdout_lines[-5:] }}

      rescue:
        - name: Deployment failed
          fail:
            msg: "Failed to deploy application artifact"

    # Set permissions
    - name: Set application permissions
      file:
        path: "{{ app_directory }}"
        owner: "{{ app_user | default('root') }}"
        group: "{{ app_user | default('root') }}"
        mode: '0755'
        recurse: yes

    # Start application
    - name: Start application
      block:
        - name: Create startup script
          copy:
            content: |
              #!/bin/bash
              cd {{ app_directory }}
              export PORT={{ app_port }}
              export NODE_ENV={{ deployment_env }}
              nohup node app.js >> {{ app_log_file }} 2>&1 &
              echo $! > {{ app_pid_file }}
              sleep 2
              if ps -p $(cat {{ app_pid_file }}) > /dev/null 2>&1; then
                echo "Application started successfully"
              else
                echo "Failed to start application"
                exit 1
              fi
            dest: "{{ app_directory }}/start.sh"
            mode: '0755'
            owner: "{{ app_user | default('root') }}"

        - name: Execute startup script
          shell: "{{ app_directory }}/start.sh"
          register: startup_result

        - name: Display startup result
          debug:
            msg: "{{ startup_result.stdout }}"

        - name: Wait for application to be ready
          wait_for:
            port: "{{ app_port }}"
            delay: 2
            timeout: 30
            host: localhost

      rescue:
        - name: Startup failed
          fail:
            msg: "Failed to start application"

    # Health checks
    - name: Verify application health
      block:
        - name: Health check - HTTP request
          uri:
            url: "http://localhost:{{ app_port }}/health"
            method: GET
            status_code: 200
          register: health_check
          retries: "{{ health_check_retries }}"
          delay: "{{ health_check_delay }}"
          until: health_check.status == 200

        - name: Health check - Response validation
          fail:
            msg: "Health check response validation failed"
          when: health_check.json.status != 'ok'

        - name: Display health status
          debug:
            msg: |
              ✓ Application is healthy
              Endpoint: http://localhost:{{ app_port }}/health
              Status: {{ health_check.json.status }}

      rescue:
        - name: Health check failed
          fail:
            msg: "Application health check failed"

    # Verify process
    - name: Verify application process
      block:
        - name: Check process is running
          shell: ps -p $(cat {{ app_pid_file }}) > /dev/null && echo "running" || echo "stopped"
          register: process_check
          changed_when: false

        - name: Display process information
          shell: |
            if [ -f "{{ app_pid_file }}" ]; then
              PID=$(cat "{{ app_pid_file }}")
              ps aux | grep $PID | grep -v grep || true
            fi
          register: process_info

        - name: Show process details
          debug:
            msg: "{{ process_info.stdout }}"

        - name: Check logs for errors
          shell: |
            tail -20 "{{ app_log_file }}" 2>/dev/null || echo "No logs available"
          register: recent_logs

        - name: Display recent logs
          debug:
            msg: |
              Recent Application Logs:
              {{ recent_logs.stdout }}

      rescue:
        - name: Process verification failed
          fail:
            msg: "Process verification failed"

    # Cleanup
    - name: Clean up temporary files
      block:
        - name: Remove artifact file
          file:
            path: "{{ artifact_source_dir }}/{{ artifact_name }}.zip"
            state: absent

        - name: Clean up old backups (keep last 5)
          shell: |
            cd "{{ backup_dir }}"
            ls -dt */ | tail -n +6 | xargs -r rm -rf
          changed_when: false

  post_tasks:
    - name: Deployment Summary
      debug:
        msg: |
          ========================================
          DEPLOYMENT SUCCESSFUL
          ========================================
          
          Application: {{ app_name }}
          Host: {{ inventory_hostname }}
          Environment: {{ deployment_env }}
          Port: {{ app_port }}
          Directory: {{ app_directory }}
          Deployment Date: {{ ansible_date_time.iso8601 }}
          
          Access Application:
          - Health Check: http://{{ inventory_hostname }}:{{ app_port }}/health
          - Main Endpoint: http://{{ inventory_hostname }}:{{ app_port }}/
          
          View Logs:
          - tail -f {{ app_log_file }}
          
          Check Process:
          - ps -p $(cat {{ app_pid_file }})
          
          ========================================

  handlers:
    - name: Restart application
      shell: |
        if [ -f "{{ app_pid_file }}" ]; then
          PID=$(cat "{{ app_pid_file }}")
          kill -TERM $PID 2>/dev/null || true
          sleep {{ service_restart_delay }}
        fi
        cd {{ app_directory }}
        nohup node app.js >> {{ app_log_file }} 2>&1 &
        echo $! > {{ app_pid_file }}
