---
- name: Deploy Node.js Application to Windows VM
  hosts: windows_vm
  gather_facts: yes

  vars:
    app_name: hello-world
    app_port: 3000
    app_directory: 'C:\apps\hello-world'
    node_check_retries: 5
    node_check_delay: 3

  tasks:

    # ========================================
    # Verify prerequisites
    # ========================================

    - name: Check if Node.js is installed
      ansible.windows.win_command:
        cmd: node --version
      register: node_check
      failed_when: false
      changed_when: false

    - name: Fail if Node.js is not installed
      ansible.builtin.fail:
        msg: "Node.js is required but not installed on the Windows VM."
      when: node_check.rc != 0

    - name: Display Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_check.stdout | trim }}"


    # ========================================
    # Create application directory
    # ========================================

    - name: Create application directory
      ansible.windows.win_file:
        path: "{{ app_directory }}"
        state: directory


    # ========================================
    # Copy application files
    # ========================================

    - name: Copy package.json
      ansible.windows.win_copy:
        src: "../package.json"
        dest: "{{ app_directory }}\package.json"

    - name: Copy package-lock.json
      ansible.windows.win_copy:
        src: "../package-lock.json"
        dest: "{{ app_directory }}\package-lock.json"

    - name: Copy application source
      ansible.windows.win_copy:
        src: "../app.js"
        dest: "{{ app_directory }}\app.js"

    # If your project has a build directory, copy it as well.
    # Uncomment and modify if needed:
    #
    # - name: Copy dist directory
    #   ansible.windows.win_copy:
    #     src: "../dist/"
    #     dest: "{{ app_directory }}\dist\"

    - name: Verify package.json exists
      ansible.windows.win_stat:
        path: "{{ app_directory }}\package.json"
      register: package_json_check

    - name: Fail if package.json is missing
      ansible.builtin.fail:
        msg: "package.json not found in {{ app_directory }}"
      when: not package_json_check.stat.exists


    # ========================================
    # Install dependencies
    # ========================================

    - name: Install npm dependencies
      ansible.windows.win_command:
        cmd: npm ci
        chdir: "{{ app_directory }}"
      register: npm_install

    - name: Display npm installation output
      ansible.builtin.debug:
        msg: "{{ npm_install.stdout }}"


    # ========================================
    # Stop existing application
    # ========================================

    - name: Check if Node.js application is running
      ansible.windows.win_shell: |
        $process = Get-Process node -ErrorAction SilentlyContinue

        if ($process) {
          Write-Output "Node.js process found"
          exit 0
        }

        Write-Output "No Node.js process found"
        exit 1
      register: existing_process_check
      failed_when: false
      changed_when: false

    - name: Stop existing Node.js application
      ansible.windows.win_shell: |
        Get-Process node -ErrorAction SilentlyContinue |
          Stop-Process -Force -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 2

        Write-Output "Existing Node.js processes stopped."
      when: existing_process_check.rc == 0


    # ========================================
    # Start application
    # ========================================

    - name: Start Node.js application
      ansible.windows.win_shell: |
        $logPath = "{{ app_directory }}\app.log"
        $errorLogPath = "{{ app_directory }}\app-error.log"
        $pidPath = "{{ app_directory }}\app.pid"

        $process = Start-Process `
          -FilePath "node" `
          -ArgumentList "app.js" `
          -WorkingDirectory "{{ app_directory }}" `
          -RedirectStandardOutput $logPath `
          -RedirectStandardError $errorLogPath `
          -WindowStyle Hidden `
          -PassThru

        $process.Id | Out-File `
          -FilePath $pidPath `
          -Encoding ascii

        Write-Output "Application started with PID: $($process.Id)"
      register: start_application

    - name: Display application startup result
      ansible.builtin.debug:
        msg: "{{ start_application.stdout }}"


    # ========================================
    # Health check
    # ========================================

    - name: Wait for application to become healthy
      ansible.windows.win_shell: |
        $maxRetries = {{ node_check_retries }}
        $retryDelay = {{ node_check_delay }}

        for ($i = 1; $i -le $maxRetries; $i++) {

          try {
            $response = Invoke-WebRequest `
              -Uri "http://localhost:{{ app_port }}/health" `
              -UseBasicParsing `
              -TimeoutSec 5 `
              -ErrorAction Stop

            if ($response.StatusCode -eq 200) {
              Write-Output "Application is healthy."
              Write-Output "Response: $($response.Content)"
              exit 0
            }
          }
          catch {
            Write-Output "Attempt $i/$maxRetries failed."
          }

          if ($i -lt $maxRetries) {
            Start-Sleep -Seconds $retryDelay
          }
        }

        Write-Output "Application did not become healthy."
        exit 1

      register: health_check
      changed_when: false

    - name: Display health check result
      ansible.builtin.debug:
        msg: "{{ health_check.stdout }}"


    # ========================================
    # Verify application process
    # ========================================

    - name: Verify Node.js process
      ansible.windows.win_shell: |
        $processes = Get-Process node -ErrorAction SilentlyContinue

        if (-not $processes) {
          Write-Output "No Node.js process found."
          exit 1
        }

        Write-Output "Node.js application is running."

        $processes | ForEach-Object {
          Write-Output "PID: $($_.Id)"
        }

      register: process_verify
      changed_when: false

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "{{ process_verify.stdout }}"


    # ========================================
    # Deployment summary
    # ========================================

    - name: Deployment Summary
      ansible.builtin.debug:
        msg: |
          ========================================
          WINDOWS VM DEPLOYMENT COMPLETE
          ========================================

          Application: {{ app_name }}
          Directory: {{ app_directory }}
          Port: {{ app_port }}

          Deployment Date: {{ ansible_date_time.iso8601 }}

          Application URL:
          http://{{ ansible_host }}:{{ app_port }}/

          Health URL:
          http://{{ ansible_host }}:{{ app_port }}/health

          Log file:
          {{ app_directory }}\app.log

          Error log:
          {{ app_directory }}\app-error.log

          ========================================