---
- name: Deploy Node.js Application to Windows VM
  hosts: windows_vm
  gather_facts: yes

  vars:
    app_name: hello-world
    app_port: 3000
    app_directory: 'C:\apps\hello-world'

    app_pid_file: 'C:\apps\hello-world\app.pid'
    app_log_file: 'C:\apps\hello-world\app.log'
    app_error_log: 'C:\apps\hello-world\app-error.log'

    health_retries: 10
    health_delay: 3

  tasks:

    # ========================================
    # Verify Node.js
    # ========================================

    - name: Check Node.js installation
      ansible.windows.win_command:
        cmd: node --version
      register: node_version
      changed_when: false

    - name: Display Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_version.stdout | trim }}"


    # ========================================
    # Verify npm
    # ========================================

    - name: Check npm installation
      ansible.windows.win_command:
        cmd: npm --version
      register: npm_version
      changed_when: false

    - name: Display npm version
      ansible.builtin.debug:
        msg: "npm version: {{ npm_version.stdout | trim }}"


    # ========================================
    # Create application directory
    # ========================================

    - name: Create application directory
      ansible.windows.win_file:
        path: "{{ app_directory }}"
        state: directory


    # ========================================
    # Stop existing application
    # ========================================

    - name: Stop existing application using PID file
      ansible.windows.win_shell: |
        $pidFile = "{{ app_pid_file }}"

        if (Test-Path $pidFile) {

          $pid = Get-Content $pidFile

          Write-Output "Found application PID: $pid"

          $process = Get-Process -Id $pid -ErrorAction SilentlyContinue

          if ($process) {
            Write-Output "Stopping application process $pid..."
            Stop-Process -Id $pid -Force
            Start-Sleep -Seconds 2
          }
          else {
            Write-Output "Process $pid is not running."
          }

          Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
        }
        else {
          Write-Output "No existing application PID file found."
        }
      register: stop_application
      changed_when: false

    - name: Display stop result
      ansible.builtin.debug:
        msg: "{{ stop_application.stdout }}"


    # ========================================
    # Free port 3000 if required
    # ========================================

    - name: Check port 3000
      ansible.windows.win_shell: |
        $connection = Get-NetTCPConnection `
          -LocalPort {{ app_port }} `
          -State Listen `
          -ErrorAction SilentlyContinue

        if ($connection) {
          $connection |
            Select-Object LocalAddress, LocalPort, State, OwningProcess |
            Format-Table -AutoSize |
            Out-String
        }
        else {
          Write-Output "Port {{ app_port }} is free."
        }
      register: port_check
      changed_when: false

    - name: Display port status
      ansible.builtin.debug:
        msg: "{{ port_check.stdout }}"


    # ========================================
    # Copy application files
    # ========================================

    - name: Copy package.json
      ansible.windows.win_copy:
        src: "../package.json"
        dest: "{{ app_directory }}\package.json"

    - name: Copy package-lock.json
      ansible.windows.win_copy:
        src: "../package-lock.json"
        dest: "{{ app_directory }}\package-lock.json"

    - name: Copy app.js
      ansible.windows.win_copy:
        src: "../app.js"
        dest: "{{ app_directory }}\app.js"


    # ========================================
    # Verify application files
    # ========================================

    - name: Verify app.js
      ansible.windows.win_stat:
        path: "{{ app_directory }}\app.js"
      register: app_file

    - name: Fail if app.js is missing
      ansible.builtin.fail:
        msg: "app.js was not copied to {{ app_directory }}"
      when: not app_file.stat.exists

    - name: Verify package.json
      ansible.windows.win_stat:
        path: "{{ app_directory }}\package.json"
      register: package_file

    - name: Fail if package.json is missing
      ansible.builtin.fail:
        msg: "package.json was not copied to {{ app_directory }}"
      when: not package_file.stat.exists


    # ========================================
    # Install dependencies
    # ========================================

    - name: Install npm dependencies
      ansible.windows.win_command:
        cmd: npm ci
        chdir: "{{ app_directory }}"
      register: npm_install

    - name: Display npm installation result
      ansible.builtin.debug:
        msg: "{{ npm_install.stdout }}"


    # ========================================
    # Configure Windows Firewall
    # ========================================

    - name: Allow Node.js application port
      community.windows.win_firewall_rule:
        name: "Node.js {{ app_name }} Port {{ app_port }}"
        localport: "{{ app_port }}"
        direction: in
        action: allow
        protocol: TCP
        state: present
        enabled: yes


    # ========================================
    # Start application
    # ========================================

    - name: Start Node.js application
      ansible.windows.win_shell: |
        $logPath = "{{ app_log_file }}"
        $errorLogPath = "{{ app_error_log }}"
        $pidPath = "{{ app_pid_file }}"

        if (Test-Path $logPath) {
          Remove-Item $logPath -Force
        }

        if (Test-Path $errorLogPath) {
          Remove-Item $errorLogPath -Force
        }

        $process = Start-Process `
          -FilePath "node.exe" `
          -ArgumentList "app.js" `
          -WorkingDirectory "{{ app_directory }}" `
          -RedirectStandardOutput $logPath `
          -RedirectStandardError $errorLogPath `
          -WindowStyle Hidden `
          -PassThru

        $process.Id | Out-File `
          -FilePath $pidPath `
          -Encoding ascii

        Write-Output "Application started."
        Write-Output "PID: $($process.Id)"
      register: start_application

    - name: Display startup result
      ansible.builtin.debug:
        msg: "{{ start_application.stdout }}"


    # ========================================
    # Wait for port
    # ========================================

    - name: Wait for application port
      ansible.windows.win_shell: |
        $maxRetries = {{ health_retries }}

        for ($i = 1; $i -le $maxRetries; $i++) {

          $connection = Get-NetTCPConnection `
            -LocalPort {{ app_port }} `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connection) {
            Write-Output "Port {{ app_port }} is listening."
            exit 0
          }

          Write-Output "Port {{ app_port }} not ready. Attempt $i/$maxRetries"

          Start-Sleep -Seconds {{ health_delay }}
        }

        Write-Output "Port {{ app_port }} did not become available."

        if (Test-Path "{{ app_log_file }}") {
          Write-Output "===== Application Log ====="
          Get-Content "{{ app_log_file }}"
        }

        if (Test-Path "{{ app_error_log }}") {
          Write-Output "===== Error Log ====="
          Get-Content "{{ app_error_log }}"
        }

        exit 1

      register: port_wait

      changed_when: false


    # ========================================
    # Health check
    # ========================================

    - name: Check application health
      ansible.windows.win_shell: |
        $url = "http://localhost:{{ app_port }}/health"
        $maxRetries = {{ health_retries }}

        for ($i = 1; $i -le $maxRetries; $i++) {

          try {

            $response = Invoke-WebRequest `
              -Uri $url `
              -UseBasicParsing `
              -TimeoutSec 5 `
              -ErrorAction Stop

            if ($response.StatusCode -eq 200) {

              Write-Output "Application is healthy."
              Write-Output "Status: $($response.StatusCode)"
              Write-Output "Response: $($response.Content)"

              exit 0
            }
          }
          catch {

            Write-Output "Health check attempt $i/$maxRetries failed."
            Write-Output $_.Exception.Message
          }

          Start-Sleep -Seconds {{ health_delay }}
        }

        Write-Output ""
        Write-Output "===== Application Log ====="

        if (Test-Path "{{ app_log_file }}") {
          Get-Content "{{ app_log_file }}"
        }

        Write-Output ""
        Write-Output "===== Application Error Log ====="

        if (Test-Path "{{ app_error_log }}") {
          Get-Content "{{ app_error_log }}"
        }

        exit 1

      register: health_check
      changed_when: false


    # ========================================
    # Verify process
    # ========================================

    - name: Verify application process
      ansible.windows.win_shell: |
        if (-not (Test-Path "{{ app_pid_file }}")) {
          Write-Output "PID file not found."
          exit 1
        }

        $pid = Get-Content "{{ app_pid_file }}"

        $process = Get-Process `
          -Id $pid `
          -ErrorAction SilentlyContinue

        if (-not $process) {
          Write-Output "Application process is not running."
          exit 1
        }

        Write-Output "Application process is running."
        Write-Output "PID: $($process.Id)"

      register: process_verify
      changed_when: false


    # ========================================
    # Deployment summary
    # ========================================

    - name: Deployment summary
      ansible.builtin.debug:
        msg: |
          ========================================
          WINDOWS VM DEPLOYMENT COMPLETE
          ========================================

          Application : {{ app_name }}
          Directory   : {{ app_directory }}
          Port        : {{ app_port }}

          Application URL:
          http://{{ ansible_host }}:{{ app_port }}/

          Health URL:
          http://{{ ansible_host }}:{{ app_port }}/health

          Log:
          {{ app_log_file }}

          Error Log:
          {{ app_error_log }}

          PID:
          {{ app_pid_file }}

          ========================================