# Production environment values for hello-world Helm chart

global:
  environment: prod
  domain: example.com

image:
  repository: hello-world
  pullPolicy: IfNotPresent
  tag: "1.0.0"  # Use specific version tags in production

replicaCount: 3

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: hello-world.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hello-world-prod-tls
      hosts:
        - hello-world.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

env:
  - name: PORT
    value: "3000"
  - name: NODE_ENV
    value: production
  - name: LOG_LEVEL
    value: warn

configMap:
  enabled: true
  data:
    APP_NAME: "hello-world"
    LOG_LEVEL: "warn"
    ENV: "production"

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

persistence:
  enabled: true
  storageClassName: "fast"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - hello-world
          topologyKey: kubernetes.io/hostname
