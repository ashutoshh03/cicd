# QA environment values for hello-world Helm chart

global:
  environment: qa
  domain: qa.example.com

image:
  repository: hello-world
  pullPolicy: IfNotPresent
  tag: "latest"

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: hello-world.qa.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hello-world-qa-tls
      hosts:
        - hello-world.qa.example.com

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

env:
  - name: PORT
    value: "3000"
  - name: NODE_ENV
    value: qa
  - name: LOG_LEVEL
    value: info

configMap:
  enabled: true
  data:
    APP_NAME: "hello-world"
    LOG_LEVEL: "info"
    ENV: "qa"

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 1
